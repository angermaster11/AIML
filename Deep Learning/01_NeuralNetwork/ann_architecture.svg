<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="780" height="440" fill="#FFFFFF"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">Our worked example: 2 inputs → 2 hidden → 1 output (sigmoid everywhere)</text>

  <!-- forward edges -->
  <g stroke="#374151" stroke-width="2">
    <line x1="124" y1="140" x2="316" y2="140"/>
    <line x1="124" y1="158" x2="316" y2="302"/>
    <line x1="124" y1="302" x2="316" y2="158"/>
    <line x1="124" y1="320" x2="316" y2="320"/>
    <line x1="384" y1="140" x2="596" y2="215"/>
    <line x1="384" y1="320" x2="596" y2="245"/>
  </g>
  <g fill="#111827">
    <polygon points="316,140 302,134 302,146"/>
    <polygon points="316,302 301,303 307,290"/>
    <polygon points="316,158 307,170 301,157"/>
    <polygon points="316,320 302,314 302,326"/>
    <polygon points="596,215 581,211 585,225"/>
    <polygon points="596,245 585,235 581,249"/>
  </g>
  <!-- weight labels -->
  <g font-size="15" font-weight="bold" fill="#1D4ED8">
    <text x="205" y="128" text-anchor="middle">w = 0.4</text>
    <text x="150" y="248" text-anchor="middle">w = -0.2</text>
    <text x="268" y="248" text-anchor="middle">w = 0.3</text>
    <text x="205" y="308" text-anchor="middle">w = 0.6</text>
    <text x="480" y="158" text-anchor="middle">w = 0.7</text>
    <text x="480" y="308" text-anchor="middle">w = -0.5</text>
  </g>
  <!-- backward dashed arrows -->
  <g stroke="#DC2626" stroke-width="2" stroke-dasharray="7 5" fill="none">
    <path d="M 600 268 Q 490 330 388 300"/>
    <path d="M 312 268 Q 220 330 128 300"/>
  </g>
  <g fill="#DC2626">
    <polygon points="388,300 402,302 394,290"/>
    <polygon points="128,300 142,302 134,290"/>
  </g>
  <text x="495" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#DC2626">δ error flows BACKWARD (dashed)</text>

  <!-- nodes -->
  <g>
    <circle cx="90" cy="150" r="34" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/>
    <circle cx="90" cy="310" r="34" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/>
    <circle cx="350" cy="150" r="34" fill="#EDE9FE" stroke="#7848E0" stroke-width="2.5"/>
    <circle cx="350" cy="310" r="34" fill="#EDE9FE" stroke="#7848E0" stroke-width="2.5"/>
    <circle cx="630" cy="230" r="34" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="90" y="145" font-size="16" font-weight="bold">x₁</text>
    <text x="90" y="166" font-size="13">= 1</text>
    <text x="90" y="305" font-size="16" font-weight="bold">x₂</text>
    <text x="90" y="326" font-size="13">= 0</text>
    <text x="350" y="145" font-size="16" font-weight="bold">h₁</text>
    <text x="350" y="166" font-size="12.5">a = 0.6225</text>
    <text x="350" y="305" font-size="16" font-weight="bold">h₂</text>
    <text x="350" y="326" font-size="12.5">a = 0.4256</text>
    <text x="630" y="225" font-size="16" font-weight="bold">ŷ</text>
    <text x="630" y="246" font-size="12.5">= 0.6042</text>
  </g>
  <g font-size="13" fill="#4B5563" text-anchor="middle">
    <text x="350" y="110">bias b = 0.1</text>
    <text x="350" y="360">bias b = -0.1</text>
    <text x="630" y="180">bias b = 0.2</text>
    <text x="90" y="70" font-weight="bold" fill="#1D4ED8">INPUT</text>
    <text x="350" y="70" font-weight="bold" fill="#7848E0">HIDDEN (sigmoid)</text>
    <text x="630" y="70" font-weight="bold" fill="#D97706">OUTPUT</text>
    <text x="712" y="225" font-size="13.5" fill="#111827">target y = 1</text>
    <text x="712" y="246" font-size="13.5" fill="#111827">loss = 0.0783</text>
    <text x="390" y="420" font-size="14" fill="#374151">Solid arrows: forward pass (values flow left → right). Dashed red: backpropagation (error flows right → left).</text>
  </g>
</svg>
