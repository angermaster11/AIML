<svg xmlns="http://www.w3.org/2000/svg" width="780" height="215" viewBox="0 0 780 215" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="780" height="215" fill="#FFFFFF"/>
  <text x="390" y="28" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#111827">The chain rule: how ∂L/∂W¹ is built — multiply the local derivatives along the path</text>

  <!-- boxes -->
  <g>
    <rect x="18" y="58" width="96" height="46" rx="10" fill="#EDE9FE" stroke="#7848E0" stroke-width="2"/>
    <rect x="150" y="58" width="96" height="46" rx="10" fill="#F5F3FF" stroke="#7848E0" stroke-width="2"/>
    <rect x="282" y="58" width="96" height="46" rx="10" fill="#EDE9FE" stroke="#7848E0" stroke-width="2"/>
    <rect x="414" y="58" width="96" height="46" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="546" y="58" width="96" height="46" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="678" y="58" width="84" height="46" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">
    <text x="66" y="87">W¹</text>
    <text x="198" y="87">z¹</text>
    <text x="330" y="87">a¹ (= h)</text>
    <text x="462" y="87">z²</text>
    <text x="594" y="87">ŷ</text>
    <text x="720" y="87">L</text>
  </g>
  <!-- forward arrows -->
  <g stroke="#374151" stroke-width="2">
    <line x1="114" y1="81" x2="148" y2="81"/><line x1="246" y1="81" x2="280" y2="81"/>
    <line x1="378" y1="81" x2="412" y2="81"/><line x1="510" y1="81" x2="544" y2="81"/>
    <line x1="642" y1="81" x2="676" y2="81"/>
  </g>
  <g fill="#111827">
    <polygon points="150,81 138,76 138,86"/><polygon points="282,81 270,76 270,86"/>
    <polygon points="414,81 402,76 402,86"/><polygon points="546,81 534,76 534,86"/>
    <polygon points="678,81 666,76 666,86"/>
  </g>
  <text x="390" y="50" text-anchor="middle" font-size="13.5" fill="#374151">forward: values flow →</text>

  <!-- derivative factors below -->
  <g text-anchor="middle" font-size="14.5" fill="#DC2626" font-weight="bold">
    <text x="66" y="140">∂L/∂W¹</text>
    <text x="132" y="140">=</text>
    <text x="198" y="140">∂z¹/∂W¹</text>
    <text x="264" y="140">×</text>
    <text x="330" y="140">∂a¹/∂z¹</text>
    <text x="396" y="140">×</text>
    <text x="462" y="140">∂z²/∂a¹</text>
    <text x="528" y="140">×</text>
    <text x="594" y="140">∂ŷ/∂z²</text>
    <text x="657" y="140">×</text>
    <text x="720" y="140">∂L/∂ŷ</text>
  </g>
  <text x="390" y="172" text-anchor="middle" font-size="13.5" fill="#4B5563">backward: start from L (right) and multiply each link's local derivative, walking left to W¹</text>
  <text x="390" y="196" text-anchor="middle" font-size="13.5" fill="#4B5563">Every link is a simple partial derivative you can compute — the chain rule just says: multiply them all.</text>
</svg>
