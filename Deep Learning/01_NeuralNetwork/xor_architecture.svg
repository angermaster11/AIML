<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" font-family="Arial, Helvetica, sans-serif">
<rect x="1" y="1" width="778" height="508" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="110" y="42" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">INPUT LAYER</text>
<text x="110" y="64" font-size="14" fill="#6B7280" text-anchor="middle">(raw data)</text>
<text x="390" y="42" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">HIDDEN LAYER</text>
<text x="390" y="64" font-size="14" fill="#6B7280" text-anchor="middle">(sigmoid)</text>
<text x="660" y="42" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">OUTPUT LAYER</text>
<text x="660" y="64" font-size="14" fill="#6B7280" text-anchor="middle">(sigmoid)</text>
<line x1="137" y1="180" x2="363" y2="180" stroke="#9CA3AF" stroke-width="2"/>
<text x="250" y="168" font-size="15" font-style="italic" fill="#374151" text-anchor="middle">w11</text>
<line x1="137" y1="180" x2="363" y2="320" stroke="#9CA3AF" stroke-width="2"/>
<text x="205" y="262" font-size="15" font-style="italic" fill="#374151" text-anchor="middle">w12</text>
<line x1="137" y1="320" x2="363" y2="180" stroke="#9CA3AF" stroke-width="2"/>
<text x="205" y="232" font-size="15" font-style="italic" fill="#374151" text-anchor="middle">w21</text>
<line x1="137" y1="320" x2="363" y2="320" stroke="#9CA3AF" stroke-width="2"/>
<text x="250" y="308" font-size="15" font-style="italic" fill="#374151" text-anchor="middle">w22</text>
<line x1="417" y1="180" x2="633" y2="250" stroke="#9CA3AF" stroke-width="2"/>
<text x="525" y="200" font-size="15" font-style="italic" fill="#374151" text-anchor="middle">u1</text>
<line x1="417" y1="320" x2="633" y2="250" stroke="#9CA3AF" stroke-width="2"/>
<text x="525" y="306" font-size="15" font-style="italic" fill="#374151" text-anchor="middle">u2</text>
<circle cx="110" cy="180" r="27" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="110" y="186" font-size="20" fill="#111827" text-anchor="middle">x₁</text>
<circle cx="110" cy="320" r="27" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="110" y="326" font-size="20" fill="#111827" text-anchor="middle">x₂</text>
<circle cx="390" cy="180" r="27" fill="#EDE9FE" stroke="#7848E0" stroke-width="3"/>
<text x="390" y="186" font-size="20" fill="#111827" text-anchor="middle">h₁</text>
<circle cx="390" cy="320" r="27" fill="#EDE9FE" stroke="#7848E0" stroke-width="3"/>
<text x="390" y="326" font-size="20" fill="#111827" text-anchor="middle">h₂</text>
<circle cx="660" cy="250" r="27" fill="#D1FAE5" stroke="#059669" stroke-width="3"/>
<text x="660" y="256" font-size="20" fill="#111827" text-anchor="middle">ŷ</text>
<rect x="330" y="368" width="120" height="26" rx="13" fill="#FFFFFF" stroke="#7848E0" stroke-dasharray="5 4"/>
<text x="390" y="386" font-size="14" fill="#4C1D95" text-anchor="middle">+ bias b1 (1×2)</text>
<rect x="600" y="368" width="120" height="26" rx="13" fill="#FFFFFF" stroke="#059669" stroke-dasharray="5 4"/>
<text x="660" y="386" font-size="14" fill="#065F46" text-anchor="middle">+ bias b2 (1×1)</text>
<rect x="30" y="368" width="170" height="26" rx="13" fill="#FFFFFF" stroke="#1D4ED8" stroke-dasharray="5 4"/>
<text x="115" y="386" font-size="14" fill="#1E3A8A" text-anchor="middle">W1 (2×2) · W2 (2×1)</text>
<rect x="18" y="428" width="138" height="36" rx="8" fill="#F9FAFB" stroke="#9CA3AF"/>
<text x="87.0" y="451" font-size="14.5" fill="#111827" text-anchor="middle">X  (4 × 2)</text>
<text x="164.0" y="452" font-size="16" fill="#6B7280" text-anchor="middle">→</text>
<rect x="170" y="428" width="138" height="36" rx="8" fill="#EFF6FF" stroke="#9CA3AF"/>
<text x="239.0" y="451" font-size="14.5" fill="#111827" text-anchor="middle">Z1 = X·W1 + b1</text>
<text x="316.0" y="452" font-size="16" fill="#6B7280" text-anchor="middle">→</text>
<rect x="322" y="428" width="138" height="36" rx="8" fill="#F9FAFB" stroke="#9CA3AF"/>
<text x="391.0" y="451" font-size="14.5" fill="#111827" text-anchor="middle">H  (4 × 2)</text>
<text x="468.0" y="452" font-size="16" fill="#6B7280" text-anchor="middle">→</text>
<rect x="474" y="428" width="138" height="36" rx="8" fill="#EFF6FF" stroke="#9CA3AF"/>
<text x="543.0" y="451" font-size="14.5" fill="#111827" text-anchor="middle">Z2 = H·W2 + b2</text>
<text x="620.0" y="452" font-size="16" fill="#6B7280" text-anchor="middle">→</text>
<rect x="626" y="428" width="138" height="36" rx="8" fill="#F9FAFB" stroke="#9CA3AF"/>
<text x="695.0" y="451" font-size="14.5" fill="#111827" text-anchor="middle">ŷ  (4 × 1)</text>
<text x="390" y="492" font-size="14" fill="#6B7280" text-anchor="middle">4 = number of samples (rows) · every sample flows through the same network</text>
</svg>