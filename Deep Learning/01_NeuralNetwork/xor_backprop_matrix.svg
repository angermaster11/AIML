<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 712" font-family="Arial, Helvetica, sans-serif">
<rect x="1" y="1" width="818" height="710" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
<rect x="60" y="14" width="700" height="42" rx="21" fill="#FFFBEB" stroke="#D97706"/>
<text x="410" y="41" font-size="16.5" font-weight="bold" fill="#92400E" text-anchor="middle">GOLDEN RULE: a gradient must have the SAME shape as its weight</text>
<text x="410" y="81" font-size="17.5" font-weight="bold" fill="#111827" text-anchor="middle">1) Error travels BACK to the hidden layer:  d_hidden = ( d_output @ W2ᵀ ) × sigmoid'(H)</text>
<rect x="299.5" y="121.0" width="17" height="68" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<line x1="299.5" y1="138.0" x2="316.5" y2="138.0" stroke="#D97706" stroke-width="0.7" opacity="0.5"/>
<line x1="299.5" y1="155.0" x2="316.5" y2="155.0" stroke="#D97706" stroke-width="0.7" opacity="0.5"/>
<line x1="299.5" y1="172.0" x2="316.5" y2="172.0" stroke="#D97706" stroke-width="0.7" opacity="0.5"/>
<text x="308.0" y="111.0" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">d_output</text>
<text x="308.0" y="209.0" font-size="13.5" fill="#6B7280" text-anchor="middle">(4 × 1)</text>
<text x="350.5" y="162" font-size="22" fill="#111827" text-anchor="middle">@</text>
<rect x="384.5" y="146.5" width="34" height="17" fill="#EDE9FE" stroke="#7848E0" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="401.5" y1="146.5" x2="401.5" y2="163.5" stroke="#7848E0" stroke-width="0.7" opacity="0.5"/>
<text x="401.5" y="136.5" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">W2ᵀ</text>
<text x="401.5" y="183.5" font-size="13.5" fill="#6B7280" text-anchor="middle">(1 × 2)</text>
<text x="452.5" y="162" font-size="22" fill="#111827" text-anchor="middle">=</text>
<rect x="486.5" y="121.0" width="34" height="68" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<line x1="503.5" y1="121.0" x2="503.5" y2="189.0" stroke="#059669" stroke-width="0.7" opacity="0.5"/>
<line x1="486.5" y1="138.0" x2="520.5" y2="138.0" stroke="#059669" stroke-width="0.7" opacity="0.5"/>
<line x1="486.5" y1="155.0" x2="520.5" y2="155.0" stroke="#059669" stroke-width="0.7" opacity="0.5"/>
<line x1="486.5" y1="172.0" x2="520.5" y2="172.0" stroke="#059669" stroke-width="0.7" opacity="0.5"/>
<text x="503.5" y="111.0" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">result</text>
<text x="503.5" y="209.0" font-size="13.5" fill="#6B7280" text-anchor="middle">(4 × 2)</text>
<text x="410" y="237" font-size="14.5" fill="#374151" text-anchor="middle">( × sigmoid'(H) is element-wise: same shape, no matrix multiplication there. )</text>
<text x="410" y="258" font-size="14.5" fill="#374151" text-anchor="middle">Forward, W2 took the signal hidden → output. Backward, the error must travel output → hidden,</text>
<text x="410" y="279" font-size="14.5" fill="#374151" text-anchor="middle">so W2 is used FLIPPED (transposed). Without ᵀ: (4×1) @ (2×1) is impossible — inner numbers 1 ≠ 2.</text>
<text x="410" y="301" font-size="17.5" font-weight="bold" fill="#111827" text-anchor="middle">2) Gradient of W2:  dW2 = Hᵀ @ d_output</text>
<rect x="291.0" y="358.0" width="68" height="34" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="308.0" y1="358.0" x2="308.0" y2="392.0" stroke="#1D4ED8" stroke-width="0.7" opacity="0.5"/>
<line x1="325.0" y1="358.0" x2="325.0" y2="392.0" stroke="#1D4ED8" stroke-width="0.7" opacity="0.5"/>
<line x1="342.0" y1="358.0" x2="342.0" y2="392.0" stroke="#1D4ED8" stroke-width="0.7" opacity="0.5"/>
<line x1="291.0" y1="375.0" x2="359.0" y2="375.0" stroke="#1D4ED8" stroke-width="0.7" opacity="0.5"/>
<text x="325.0" y="348.0" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Hᵀ</text>
<text x="325.0" y="412.0" font-size="13.5" fill="#6B7280" text-anchor="middle">(2 × 4)</text>
<text x="393.0" y="382" font-size="22" fill="#111827" text-anchor="middle">@</text>
<rect x="427.0" y="341.0" width="17" height="68" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<line x1="427.0" y1="358.0" x2="444.0" y2="358.0" stroke="#D97706" stroke-width="0.7" opacity="0.5"/>
<line x1="427.0" y1="375.0" x2="444.0" y2="375.0" stroke="#D97706" stroke-width="0.7" opacity="0.5"/>
<line x1="427.0" y1="392.0" x2="444.0" y2="392.0" stroke="#D97706" stroke-width="0.7" opacity="0.5"/>
<text x="435.5" y="331.0" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">d_output</text>
<text x="435.5" y="429.0" font-size="13.5" fill="#6B7280" text-anchor="middle">(4 × 1)</text>
<text x="478.0" y="382" font-size="22" fill="#111827" text-anchor="middle">=</text>
<rect x="512.0" y="358.0" width="17" height="34" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<line x1="512.0" y1="375.0" x2="529.0" y2="375.0" stroke="#059669" stroke-width="0.7" opacity="0.5"/>
<text x="520.5" y="348.0" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">dW2</text>
<text x="520.5" y="412.0" font-size="13.5" fill="#6B7280" text-anchor="middle">(2 × 1) = W2</text>
<text x="410" y="457" font-size="14.5" fill="#374151" text-anchor="middle">The inner 4 = the 4 samples. Matrix multiplication multiplies and ADDS them up —</text>
<text x="410" y="478" font-size="14.5" fill="#374151" text-anchor="middle">so every sample's contribution is summed into ONE gradient, exactly what a weight update needs.</text>
<text x="410" y="506" font-size="17.5" font-weight="bold" fill="#111827" text-anchor="middle">3) Gradient of W1:  dW1 = Xᵀ @ d_hidden</text>
<rect x="274.0" y="563.0" width="68" height="34" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="291.0" y1="563.0" x2="291.0" y2="597.0" stroke="#1D4ED8" stroke-width="0.7" opacity="0.5"/>
<line x1="308.0" y1="563.0" x2="308.0" y2="597.0" stroke="#1D4ED8" stroke-width="0.7" opacity="0.5"/>
<line x1="325.0" y1="563.0" x2="325.0" y2="597.0" stroke="#1D4ED8" stroke-width="0.7" opacity="0.5"/>
<line x1="274.0" y1="580.0" x2="342.0" y2="580.0" stroke="#1D4ED8" stroke-width="0.7" opacity="0.5"/>
<text x="308.0" y="553.0" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Xᵀ</text>
<text x="308.0" y="617.0" font-size="13.5" fill="#6B7280" text-anchor="middle">(2 × 4)</text>
<text x="376.0" y="587" font-size="22" fill="#111827" text-anchor="middle">@</text>
<rect x="410.0" y="546.0" width="34" height="68" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<line x1="427.0" y1="546.0" x2="427.0" y2="614.0" stroke="#D97706" stroke-width="0.7" opacity="0.5"/>
<line x1="410.0" y1="563.0" x2="444.0" y2="563.0" stroke="#D97706" stroke-width="0.7" opacity="0.5"/>
<line x1="410.0" y1="580.0" x2="444.0" y2="580.0" stroke="#D97706" stroke-width="0.7" opacity="0.5"/>
<line x1="410.0" y1="597.0" x2="444.0" y2="597.0" stroke="#D97706" stroke-width="0.7" opacity="0.5"/>
<text x="427.0" y="536.0" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">d_hidden</text>
<text x="427.0" y="634.0" font-size="13.5" fill="#6B7280" text-anchor="middle">(4 × 2)</text>
<text x="478.0" y="587" font-size="22" fill="#111827" text-anchor="middle">=</text>
<rect x="512.0" y="563.0" width="34" height="34" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<line x1="529.0" y1="563.0" x2="529.0" y2="597.0" stroke="#059669" stroke-width="0.7" opacity="0.5"/>
<line x1="512.0" y1="580.0" x2="546.0" y2="580.0" stroke="#059669" stroke-width="0.7" opacity="0.5"/>
<text x="529.0" y="553.0" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">dW1</text>
<text x="529.0" y="617.0" font-size="13.5" fill="#6B7280" text-anchor="middle">(2 × 2) = W1</text>
<text x="410" y="662" font-size="14.5" fill="#374151" text-anchor="middle">Same pattern everywhere: transpose puts the SAMPLE axis (4) in the middle,</text>
<text x="410" y="683" font-size="14.5" fill="#374151" text-anchor="middle">where multiplication sums it away — and the result lands in the weight's own shape.</text>
</svg>