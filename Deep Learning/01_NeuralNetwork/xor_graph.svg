<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" font-family="Arial, Helvetica, sans-serif">
  <!-- background -->
  <rect x="1" y="1" width="678" height="528" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>

  <!-- gridlines -->
  <line x1="480" y1="90" x2="480" y2="430" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="140" y1="90" x2="480" y2="90" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- class diagonals (drawn under the points) -->
  <line x1="140" y1="90" x2="480" y2="430" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="8 6" opacity="0.45"/>
  <line x1="140" y1="430" x2="480" y2="90" stroke="#6B7280" stroke-width="2" stroke-dasharray="8 6" opacity="0.45"/>

  <!-- axes -->
  <line x1="140" y1="430" x2="565" y2="430" stroke="#111827" stroke-width="2.5"/>
  <polygon points="565,430 550,423 550,437" fill="#111827"/>
  <line x1="140" y1="430" x2="140" y2="45" stroke="#111827" stroke-width="2.5"/>
  <polygon points="140,45 133,60 147,60" fill="#111827"/>

  <!-- ticks -->
  <line x1="140" y1="430" x2="140" y2="440" stroke="#111827" stroke-width="2.5"/>
  <line x1="480" y1="430" x2="480" y2="440" stroke="#111827" stroke-width="2.5"/>
  <line x1="130" y1="430" x2="140" y2="430" stroke="#111827" stroke-width="2.5"/>
  <line x1="130" y1="90" x2="140" y2="90" stroke="#111827" stroke-width="2.5"/>

  <!-- tick labels -->
  <text x="140" y="468" font-size="21" fill="#111827" text-anchor="middle">0</text>
  <text x="480" y="468" font-size="21" fill="#111827" text-anchor="middle">1</text>
  <text x="112" y="437" font-size="21" fill="#111827" text-anchor="middle">0</text>
  <text x="112" y="97" font-size="21" fill="#111827" text-anchor="middle">1</text>

  <!-- axis titles -->
  <text x="578" y="474" font-size="24" font-style="italic" fill="#111827" text-anchor="middle">x₁</text>
  <text x="140" y="28" font-size="24" font-style="italic" fill="#111827" text-anchor="middle">x₂</text>

  <!-- points: class 1 = filled blue, class 0 = hollow -->
  <!-- (0,1) = 1 -->
  <circle cx="140" cy="90" r="11" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="3"/>
  <!-- (1,1) = 0 -->
  <circle cx="480" cy="90" r="11" fill="#FFFFFF" stroke="#374151" stroke-width="3.5"/>
  <!-- (0,0) = 0 -->
  <circle cx="140" cy="430" r="11" fill="#FFFFFF" stroke="#374151" stroke-width="3.5"/>
  <!-- (1,0) = 1 -->
  <circle cx="480" cy="430" r="11" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="3"/>

  <!-- point labels -->
  <text x="164" y="97" font-size="20" fill="#111827">(0, 1) = 1</text>
  <text x="504" y="97" font-size="20" fill="#111827">(1, 1) = 0</text>
  <text x="164" y="418" font-size="20" fill="#111827">(0, 0) = 0</text>
  <text x="504" y="418" font-size="20" fill="#111827">(1, 0) = 1</text>

  <!-- legend -->
  <circle cx="215" cy="498" r="9" fill="#1D4ED8"/>
  <text x="232" y="505" font-size="19" fill="#111827">Output = 1</text>
  <circle cx="385" cy="498" r="9" fill="#FFFFFF" stroke="#374151" stroke-width="3"/>
  <text x="402" y="505" font-size="19" fill="#111827">Output = 0</text>
</svg>
