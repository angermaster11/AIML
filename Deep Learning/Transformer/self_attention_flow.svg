<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="Arial, Helvetica, sans-serif">
<rect x="1" y="1" width="878" height="428" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="440" y="40" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">SELF-ATTENTION — pura flow ek nazar me</text>
<rect x="95" y="70" width="110" height="42" rx="9" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="150" y="97" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">dog</text>
<rect x="235" y="70" width="110" height="42" rx="9" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="290" y="97" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">runs</text>
<rect x="375" y="70" width="110" height="42" rx="9" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="430" y="97" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">fast</text>
<text x="640" y="97" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="middle">tokens → embeddings X</text>
<text x="290" y="140" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="middle">↓  X se teen copies, teen alag weight matrices</text>
<rect x="90" y="152" width="120" height="56" rx="9" fill="#FCE7F3" stroke="#9D174D" stroke-width="2"/>
<text x="150" y="176" font-size="14.5" font-weight="bold" fill="#111827" text-anchor="middle">Q — Query</text>
<text x="150" y="196" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">kya dhoondhu</text>
<rect x="230" y="152" width="120" height="56" rx="9" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="290" y="176" font-size="14.5" font-weight="bold" fill="#111827" text-anchor="middle">K — Key</text>
<text x="290" y="196" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">mere paas kya hai</text>
<rect x="370" y="152" width="120" height="56" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="430" y="176" font-size="14.5" font-weight="bold" fill="#111827" text-anchor="middle">V — Value</text>
<text x="430" y="196" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="middle">asal content</text>
<text x="640" y="172" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="middle">Q = X · W_Q</text>
<text x="640" y="194" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="middle">K = X · W_K</text>
<text x="640" y="216" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="middle">V = X · W_V</text>
<rect x="90" y="236" width="400" height="48" rx="9" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="290" y="257" font-size="14.5" font-weight="bold" fill="#111827" text-anchor="middle">STEP 1 · scores = Q · K^T</text>
<text x="290" y="275" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle">har token ka har token se match — 3 × 3 table</text>
<text x="290" y="298" font-size="16" font-weight="normal" fill="#111827" text-anchor="middle">↓</text>
<rect x="90" y="292" width="400" height="48" rx="9" fill="#FCE7F3" stroke="#9D174D" stroke-width="2"/>
<text x="290" y="313" font-size="14.5" font-weight="bold" fill="#111827" text-anchor="middle">STEP 2 · scale ÷ √d_k, phir softmax</text>
<text x="290" y="331" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle">har row ke weights, jod = 1</text>
<text x="290" y="354" font-size="16" font-weight="normal" fill="#111827" text-anchor="middle">↓</text>
<rect x="90" y="348" width="400" height="48" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="290" y="369" font-size="14.5" font-weight="bold" fill="#111827" text-anchor="middle">STEP 3 · output = weights × V</text>
<text x="290" y="387" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle">har token ka naya, context-mila vector</text>
<text x="640" y="268" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="middle">koi RNN nahi —</text>
<text x="640" y="290" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="middle">saare tokens ek sath,</text>
<text x="640" y="312" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="middle">har token seedha</text>
<text x="640" y="334" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="middle">har token se baat karta hai</text>
</svg>