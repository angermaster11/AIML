<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="300" viewBox="0 0 1180 300" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1180" height="300" rx="18" fill="#0F172A"/>
  <text x="590" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#F8FAFC">ImageNet — Final Architecture (Experiment 3)</text>
  <text x="590" y="68" text-anchor="middle" font-size="13" fill="#94A3B8">784 → 256 → 128 → 10 &#160;|&#160; BatchNorm + Dropout &#160;|&#160; 235,914 parameters</text>

  <!-- Input -->
  <rect x="30" y="105" width="130" height="90" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="95" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#E2E8F0">INPUT</text>
  <text x="95" y="163" text-anchor="middle" font-size="13" fill="#94A3B8">784 pixels</text>
  <text x="95" y="182" text-anchor="middle" font-size="12" fill="#64748B">28 × 28 image, flat</text>

  <text x="168" y="157" font-size="22" fill="#F97316">→</text>

  <!-- Block 1 -->
  <rect x="195" y="95" width="215" height="110" rx="12" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
  <text x="302" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#E2E8F0">Linear 784 → 256</text>
  <text x="302" y="145" text-anchor="middle" font-size="13" fill="#CBD5E1">BatchNorm1d(256)</text>
  <text x="302" y="165" text-anchor="middle" font-size="13" fill="#CBD5E1">ReLU</text>
  <text x="302" y="185" text-anchor="middle" font-size="13" fill="#CBD5E1">Dropout(0.3)</text>
  <text x="302" y="225" text-anchor="middle" font-size="12" fill="#64748B">200,960 + 512 params</text>

  <text x="418" y="157" font-size="22" fill="#F97316">→</text>

  <!-- Block 2 -->
  <rect x="445" y="95" width="215" height="110" rx="12" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
  <text x="552" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#E2E8F0">Linear 256 → 128</text>
  <text x="552" y="145" text-anchor="middle" font-size="13" fill="#CBD5E1">BatchNorm1d(128)</text>
  <text x="552" y="165" text-anchor="middle" font-size="13" fill="#CBD5E1">ReLU</text>
  <text x="552" y="185" text-anchor="middle" font-size="13" fill="#CBD5E1">Dropout(0.3)</text>
  <text x="552" y="225" text-anchor="middle" font-size="12" fill="#64748B">32,896 + 256 params</text>

  <text x="668" y="157" font-size="22" fill="#F97316">→</text>

  <!-- Output layer -->
  <rect x="695" y="105" width="180" height="90" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/>
  <text x="785" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#E2E8F0">Linear 128 → 10</text>
  <text x="785" y="163" text-anchor="middle" font-size="13" fill="#94A3B8">10 logits (raw scores)</text>
  <text x="785" y="182" text-anchor="middle" font-size="12" fill="#64748B">1,290 params · no softmax</text>

  <text x="883" y="157" font-size="22" fill="#F97316">→</text>

  <!-- Argmax -->
  <rect x="910" y="105" width="150" height="90" rx="12" fill="#7C2D12" stroke="#F97316" stroke-width="2"/>
  <text x="985" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#FFEDD5">argmax(dim=1)</text>
  <text x="985" y="163" text-anchor="middle" font-size="13" fill="#FED7AA">biggest score's</text>
  <text x="985" y="182" text-anchor="middle" font-size="13" fill="#FED7AA">position = digit</text>

  <text x="590" y="272" text-anchor="middle" font-size="13" fill="#94A3B8">Loss: CrossEntropyLoss (softmax lives inside the loss) &#160;·&#160; Optimizer: Adam, lr 0.001 &#160;·&#160; Batch size: 32 &#160;·&#160; Epochs: 20</text>
</svg>
