<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Arial, Helvetica, sans-serif">
<rect x="1" y="1" width="858" height="298" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="430" y="38" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">BatchNorm on ONE channel — the same 4 steps for every channel</text>
<rect x="25" y="80" width="185" height="105" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="117" y="112" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">1 batch of values</text>
<text x="117" y="132" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="middle">(one channel)</text>
<text x="117" y="168" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">[1, 2, 3, 4]</text>
<text x="225" y="140" font-size="20" font-weight="normal" fill="#111827" text-anchor="middle">→</text>
<rect x="233" y="80" width="185" height="105" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="325" y="112" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">find mean μ and</text>
<text x="325" y="132" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="middle">variance σ²</text>
<text x="325" y="168" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">μ = 2.5 · σ² = 1.25</text>
<text x="433" y="140" font-size="20" font-weight="normal" fill="#111827" text-anchor="middle">→</text>
<rect x="441" y="80" width="185" height="105" rx="10" fill="#FCE7F3" stroke="#9D174D" stroke-width="2"/>
<text x="533" y="112" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">normalise</text>
<text x="533" y="132" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="middle">(x − μ) / √(σ² + ε)</text>
<text x="533" y="168" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">[−1.34, −0.45, 0.45, 1.34]</text>
<text x="641" y="140" font-size="20" font-weight="normal" fill="#111827" text-anchor="middle">→</text>
<rect x="649" y="80" width="185" height="105" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="741" y="112" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">scale γ and shift β</text>
<text x="741" y="132" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="middle">(learned by training)</text>
<text x="741" y="168" font-size="13" font-weight="normal" fill="#374151" text-anchor="middle">y = γ · x̂ + β</text>
<text x="430" y="232" font-size="14" font-weight="normal" fill="#111827" text-anchor="middle">After normalising, the channel has mean 0 and variance 1 — then γ and β let the network choose the best range again.</text>
<text x="430" y="262" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="middle">At test time there is no batch to average — BatchNorm uses running averages collected during training.</text>
</svg>