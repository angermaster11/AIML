<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" font-family="Arial, Helvetica, sans-serif">
<rect x="1" y="1" width="778" height="638" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="390" y="40" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">A COMPLETE CNN FOR MNIST (LeNet style)</text>
<rect x="140" y="70" width="500" height="52" rx="9" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="390" y="93" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">INPUT</text>
<text x="390" y="113" font-size="13.5" fill="#374151" text-anchor="middle">output: (1, 28, 28) &#160;·&#160; one grey image</text>
<text x="390" y="136" font-size="17" fill="#111827" text-anchor="middle">↓</text>
<rect x="140" y="132" width="500" height="52" rx="9" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="390" y="155" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Conv2d(1 → 32, k=3) + ReLU</text>
<text x="390" y="175" font-size="13.5" fill="#374151" text-anchor="middle">output: (32, 26, 26) &#160;·&#160; 320 params</text>
<text x="390" y="198" font-size="17" fill="#111827" text-anchor="middle">↓</text>
<rect x="140" y="194" width="500" height="52" rx="9" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="390" y="217" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">MaxPool2d(2)</text>
<text x="390" y="237" font-size="13.5" fill="#374151" text-anchor="middle">output: (32, 13, 13) &#160;·&#160; size halves, 0 params</text>
<text x="390" y="260" font-size="17" fill="#111827" text-anchor="middle">↓</text>
<rect x="140" y="256" width="500" height="52" rx="9" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="390" y="279" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Conv2d(32 → 64, k=3) + ReLU</text>
<text x="390" y="299" font-size="13.5" fill="#374151" text-anchor="middle">output: (64, 11, 11) &#160;·&#160; 18,496 params</text>
<text x="390" y="322" font-size="17" fill="#111827" text-anchor="middle">↓</text>
<rect x="140" y="318" width="500" height="52" rx="9" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="390" y="341" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">MaxPool2d(2)</text>
<text x="390" y="361" font-size="13.5" fill="#374151" text-anchor="middle">output: (64, 5, 5) &#160;·&#160; 0 params</text>
<text x="390" y="384" font-size="17" fill="#111827" text-anchor="middle">↓</text>
<rect x="140" y="380" width="500" height="52" rx="9" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="390" y="403" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Flatten</text>
<text x="390" y="423" font-size="13.5" fill="#374151" text-anchor="middle">output: 1600 numbers &#160;·&#160; 64 × 5 × 5</text>
<text x="390" y="446" font-size="17" fill="#111827" text-anchor="middle">↓</text>
<rect x="140" y="442" width="500" height="52" rx="9" fill="#EDE9FE" stroke="#7848E0" stroke-width="2"/>
<text x="390" y="465" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Linear(1600 → 128) + ReLU + Dropout</text>
<text x="390" y="485" font-size="13.5" fill="#374151" text-anchor="middle">output: 128 &#160;·&#160; 204,928 params</text>
<text x="390" y="508" font-size="17" fill="#111827" text-anchor="middle">↓</text>
<rect x="140" y="504" width="500" height="52" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="390" y="527" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Linear(128 → 10)</text>
<text x="390" y="547" font-size="13.5" fill="#374151" text-anchor="middle">output: 10 logits &#160;·&#160; 1,290 params</text>
<text x="390" y="582" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Total parameters: 225,034</text>
</svg>