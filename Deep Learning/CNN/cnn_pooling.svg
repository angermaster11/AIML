<text x="430" y="262" font-size="14" fill="#111827" text-anchor="middle">A 2 × 2 window slides with stride 2. Each window of 4 numbers becomes ONE number — biggest (max), average (avg) or smallest (min).</text>
<text x="430" y="290" font-size="14" fill="#6B7280" text-anchor="middle">Size halves: 4 × 4 → 2 × 2. Max pooling is the standard choice; min pooling is rare.</text>
