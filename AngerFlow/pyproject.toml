[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "angerflow"
version = "0.1.0"
description = "A Keras-style deep learning framework built from scratch in NumPy"
authors = [{ name = "Anger" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]